<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <radialGradient id="head" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#282E40"/>
      <stop offset="55%"  stop-color="#161C28"/>
      <stop offset="100%" stop-color="#0C1018"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#08090F"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>
    <!-- Rosewood: warm dark red-brown, horizontal grain suggest -->
    <linearGradient id="key-nat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8C2E18"/>
      <stop offset="18%"  stop-color="#A83A22"/>
      <stop offset="50%"  stop-color="#7A2212"/>
      <stop offset="82%"  stop-color="#9C3620"/>
      <stop offset="100%" stop-color="#601A0A"/>
    </linearGradient>
    <!-- Arch undercut overlay (lighter centre suggesting carved arch) -->
    <linearGradient id="key-arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C04830" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#C04830" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C04830" stop-opacity="0"/>
    </linearGradient>
    <!-- Dark rosewood for accidentals -->
    <linearGradient id="key-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#501408"/>
      <stop offset="40%"  stop-color="#6A1E0E"/>
      <stop offset="100%" stop-color="#3C0E06"/>
    </linearGradient>
    <!-- Metallic silver for resonator tubes -->
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5A6A6A"/>
      <stop offset="28%"  stop-color="#9AABAB"/>
      <stop offset="55%"  stop-color="#7A8E8E"/>
      <stop offset="85%"  stop-color="#4A5858"/>
      <stop offset="100%" stop-color="#384848"/>
    </linearGradient>
    <!-- Film strip sprocket border pattern -->
    <pattern id="film-strip" x="0" y="0" width="20" height="8" patternUnits="userSpaceOnUse">
      <rect width="20" height="8" fill="#C08A20"/>
      <rect x="4.5" y="1.5" width="11" height="5" rx="1" fill="#0A0B12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- Film strip border rules (sprocket perforations top + bottom) -->
  <rect x="0" y="0"   width="880" height="8" fill="url(#film-strip)"/>
  <rect x="0" y="192" width="880" height="8" fill="url(#film-strip)"/>

  <!-- ══ DRUM (top-down view) ══ -->
  <!-- Shell body -->
  <circle cx="80" cy="100" r="60" fill="#100C06"/>
  <!-- Hoop -->
  <circle cx="80" cy="100" r="60" fill="none" stroke="#C08A20" stroke-width="5"/>
  <!-- Head surface -->
  <circle cx="80" cy="100" r="52" fill="url(#head)"/>
  <!-- Bearing edge -->
  <circle cx="80" cy="100" r="52" fill="none" stroke="#241A08" stroke-width="2"/>
  <!-- Inner head ring (subtle tension visual) -->
  <circle cx="80" cy="100" r="44" fill="none" stroke="#1C2030" stroke-width="0.8"/>

  <!-- Tension rod lines from center to each lug (8 positions) -->
  <line x1="80" y1="100" x2="140" y2="100" stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="122" y2="142" stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="80"  y2="160" stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="38"  y2="142" stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="20"  y2="100" stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="38"  y2="58"  stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="80"  y2="40"  stroke="#1C1608" stroke-width="0.8"/>
  <line x1="80" y1="100" x2="122" y2="58"  stroke="#1C1608" stroke-width="0.8"/>

  <!-- Center dot -->
  <circle cx="80" cy="100" r="4"   fill="#C08A20" fill-opacity="0.2"/>
  <circle cx="80" cy="100" r="2"   fill="#C08A20" fill-opacity="0.55"/>

  <!-- Lug bolts — 8 positions on hoop (r=60 from cx=80,cy=100) -->
  <!-- 0°   (140,100) -->
  <circle cx="140" cy="100" r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="140" cy="100" r="2" fill="#C08A20"/>
  <!-- 45°  (122,142) -->
  <circle cx="122" cy="142" r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="122" cy="142" r="2" fill="#C08A20"/>
  <!-- 90°  (80,160) -->
  <circle cx="80"  cy="160" r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="80"  cy="160" r="2" fill="#C08A20"/>
  <!-- 135° (38,142) -->
  <circle cx="38"  cy="142" r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="38"  cy="142" r="2" fill="#C08A20"/>
  <!-- 180° (20,100) -->
  <circle cx="20"  cy="100" r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="20"  cy="100" r="2" fill="#C08A20"/>
  <!-- 225° (38,58) -->
  <circle cx="38"  cy="58"  r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="38"  cy="58"  r="2" fill="#C08A20"/>
  <!-- 270° (80,40) -->
  <circle cx="80"  cy="40"  r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="80"  cy="40"  r="2" fill="#C08A20"/>
  <!-- 315° (122,58) -->
  <circle cx="122" cy="58"  r="5" fill="#1A1506" stroke="#C08A20" stroke-width="1.3"/>
  <circle cx="122" cy="58"  r="2" fill="#C08A20"/>


  <!-- ══ MARIMBA ══ -->
  <!-- Outer frame (dark mahogany) -->
  <rect x="152" y="75"  width="166" height="4"  fill="#3A2010" rx="1"/>
  <rect x="152" y="133" width="166" height="4"  fill="#3A2010" rx="1"/>
  <rect x="152" y="75"  width="4"   height="62" fill="#3A2010" rx="1"/>
  <rect x="314" y="75"  width="4"   height="62" fill="#3A2010" rx="1"/>

  <!-- Natural keys: C D E F G A B C D E (10 keys, 14px wide, 2px gap, y=79 to y=132, h=53) -->
  <rect x="156" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="172" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="188" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="204" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="220" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="236" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="252" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="268" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="284" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>
  <rect x="300" y="79" width="14" height="53" fill="url(#key-nat)" rx="1"/>

  <!-- Arch undercut overlay (centred highlight on each bar suggesting the carved arch beneath) -->
  <rect x="158" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="174" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="190" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="206" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="222" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="238" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="254" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="270" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="286" y="79" width="10" height="53" fill="url(#key-arch)"/>
  <rect x="302" y="79" width="10" height="53" fill="url(#key-arch)"/>

  <!-- Suspension cord holes at nodal points (~22% from each end = y=91 and y=120) -->
  <!-- C1  --><circle cx="163" cy="91"  r="1.6" fill="#1A0806"/><circle cx="163" cy="120" r="1.6" fill="#1A0806"/>
  <!-- D1  --><circle cx="179" cy="91"  r="1.6" fill="#1A0806"/><circle cx="179" cy="120" r="1.6" fill="#1A0806"/>
  <!-- E1  --><circle cx="195" cy="91"  r="1.6" fill="#1A0806"/><circle cx="195" cy="120" r="1.6" fill="#1A0806"/>
  <!-- F1  --><circle cx="211" cy="91"  r="1.6" fill="#1A0806"/><circle cx="211" cy="120" r="1.6" fill="#1A0806"/>
  <!-- G1  --><circle cx="227" cy="91"  r="1.6" fill="#1A0806"/><circle cx="227" cy="120" r="1.6" fill="#1A0806"/>
  <!-- A1  --><circle cx="243" cy="91"  r="1.6" fill="#1A0806"/><circle cx="243" cy="120" r="1.6" fill="#1A0806"/>
  <!-- B1  --><circle cx="259" cy="91"  r="1.6" fill="#1A0806"/><circle cx="259" cy="120" r="1.6" fill="#1A0806"/>
  <!-- C2  --><circle cx="275" cy="91"  r="1.6" fill="#1A0806"/><circle cx="275" cy="120" r="1.6" fill="#1A0806"/>
  <!-- D2  --><circle cx="291" cy="91"  r="1.6" fill="#1A0806"/><circle cx="291" cy="120" r="1.6" fill="#1A0806"/>
  <!-- E2  --><circle cx="307" cy="91"  r="1.6" fill="#1A0806"/><circle cx="307" cy="120" r="1.6" fill="#1A0806"/>

  <!-- Gap lines between naturals -->
  <rect x="170" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="186" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="202" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="218" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="234" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="250" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="266" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="282" y="79" width="2" height="53" fill="#08090F"/>
  <rect x="298" y="79" width="2" height="53" fill="#08090F"/>

  <!-- Accidental keys (10px wide, 32px tall, dark rosewood, drawn on top) -->
  <!-- C#1 --><rect x="160" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- D#1 --><rect x="176" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- F#1 --><rect x="208" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- G#1 --><rect x="224" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- A#1 --><rect x="240" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- C#2 --><rect x="272" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>
  <!-- D#2 --><rect x="288" y="79" width="10" height="32" fill="url(#key-acc)" rx="1"/>

  <!-- Accidental top-edge sheen -->
  <rect x="160" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="176" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="208" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="224" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="240" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="272" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>
  <rect x="288" y="79" width="10" height="2" fill="#7A2A18" rx="1"/>

  <!-- Resonator tubes (metallic silver, tapering shorter for higher pitch) -->
  <rect x="159" y="138" width="8" height="34" fill="url(#tube)" rx="1"/>
  <rect x="175" y="138" width="8" height="31" fill="url(#tube)" rx="1"/>
  <rect x="191" y="138" width="8" height="28" fill="url(#tube)" rx="1"/>
  <rect x="207" y="138" width="8" height="25" fill="url(#tube)" rx="1"/>
  <rect x="223" y="138" width="8" height="22" fill="url(#tube)" rx="1"/>
  <rect x="239" y="138" width="8" height="19" fill="url(#tube)" rx="1"/>
  <rect x="255" y="138" width="8" height="17" fill="url(#tube)" rx="1"/>
  <rect x="271" y="138" width="8" height="15" fill="url(#tube)" rx="1"/>
  <rect x="287" y="138" width="8" height="13" fill="url(#tube)" rx="1"/>
  <rect x="303" y="138" width="8" height="11" fill="url(#tube)" rx="1"/>

  <!-- Tube top-rim highlights (brighter edge simulating open cylinder mouth) -->
  <rect x="159" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="175" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="191" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="207" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="223" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="239" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="255" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="271" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="287" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>
  <rect x="303" y="138" width="8" height="2" fill="#B8C8C8" rx="1"/>


  <!-- ══ AMBER CUT-LINE DIVIDER ══ -->
  <line x1="334" y1="8"   x2="334" y2="192" stroke="#C08A20" stroke-width="7" stroke-opacity="0.10"/>
  <line x1="334" y1="8"   x2="334" y2="192" stroke="#C08A20" stroke-width="1.5"/>
  <polygon points="328,8   340,8   334,18"  fill="#C08A20"/>
  <polygon points="328,192 340,192 334,182" fill="#C08A20"/>


  <!-- ══ TYPOGRAPHY ══ -->
  <text x="354" y="134"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="96"
        fill="#FFFFFF"
        letter-spacing="2">WGI</text>

  <line x1="356" y1="147" x2="618" y2="147" stroke="#C08A20" stroke-width="1.5" stroke-opacity="0.4"/>

  <text x="360" y="167"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="700"
        fill="#C08A20"
        letter-spacing="8">VIDEO-SYNC</text>

  <text x="361" y="184"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#283048"
        letter-spacing="2.5">COMPETITION RECORDING PIPELINE</text>

  <!-- ══ FILM PLAY ICON (upper-right) ══ -->
  <circle cx="851" cy="52" r="26" fill="#C08A20" fill-opacity="0.09" stroke="#C08A20" stroke-opacity="0.50" stroke-width="1.8"/>
  <polygon points="843,40 843,64 868,52" fill="#C08A20" fill-opacity="0.70"/>

  <!-- Small film strip strip below play icon -->
  <rect x="820" y="84" width="62" height="40" rx="2" fill="#0C0E18" stroke="#C08A20" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Left sprocket lane -->
  <rect x="820" y="84" width="9" height="40" fill="#0A0B12"/>
  <rect x="822" y="88"  width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="822" y="96"  width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="822" y="104" width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="822" y="112" width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <!-- Right sprocket lane -->
  <rect x="873" y="84" width="9" height="40" fill="#0A0B12"/>
  <rect x="875" y="88"  width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="875" y="96"  width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="875" y="104" width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <rect x="875" y="112" width="5" height="4" rx="0.8" fill="#C08A20" fill-opacity="0.55"/>
  <!-- Frame separator lines -->
  <line x1="849" y1="84" x2="849" y2="124" stroke="#C08A20" stroke-width="0.7" stroke-opacity="0.25"/>
  <!-- Subtle frame content (dim rects suggesting recorded video) -->
  <rect x="831" y="88"  width="16" height="14" rx="1" fill="#1A2030" stroke="#C08A20" stroke-width="0.4" stroke-opacity="0.2"/>
  <rect x="852" y="88"  width="16" height="14" rx="1" fill="#1A2030" stroke="#C08A20" stroke-width="0.4" stroke-opacity="0.2"/>
  <rect x="831" y="106" width="16" height="14" rx="1" fill="#1A2030" stroke="#C08A20" stroke-width="0.4" stroke-opacity="0.2"/>
  <rect x="852" y="106" width="16" height="14" rx="1" fill="#1A2030" stroke="#C08A20" stroke-width="0.4" stroke-opacity="0.2"/>
</svg>
