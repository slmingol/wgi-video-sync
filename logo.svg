<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C0F18"/>
      <stop offset="55%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#141826"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- Amber border rules -->
  <rect x="0" y="0" width="880" height="3" fill="#C08A20"/>
  <rect x="0" y="197" width="880" height="3" fill="#C08A20"/>

  <!-- ── FILM STRIP ── -->
  <!-- Strip body -->
  <rect x="40" y="72" width="168" height="56" fill="#1A1D28" rx="2"/>

  <!-- Top rail -->
  <rect x="40" y="72" width="168" height="10" fill="#222736" rx="2"/>
  <!-- Bottom rail -->
  <rect x="40" y="118" width="168" height="10" fill="#222736" rx="2"/>

  <!-- Sprocket holes — top -->
  <rect x="48"  y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="64"  y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="80"  y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="96"  y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="112" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="128" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="144" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="160" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="176" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="192" y="74" width="8" height="6" rx="1" fill="#0C0F18"/>

  <!-- Sprocket holes — bottom -->
  <rect x="48"  y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="64"  y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="80"  y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="96"  y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="112" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="128" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="144" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="160" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="176" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>
  <rect x="192" y="120" width="8" height="6" rx="1" fill="#0C0F18"/>

  <!-- Frame content areas -->
  <rect x="40"  y="82" width="55" height="36" fill="#111420"/>
  <rect x="97"  y="82" width="53" height="36" fill="#161A27"/>
  <rect x="152" y="82" width="56" height="36" fill="#111420"/>

  <!-- Frame dividers -->
  <rect x="95"  y="82" width="1" height="36" fill="#1A1D28"/>
  <rect x="151" y="82" width="1" height="36" fill="#1A1D28"/>

  <!-- Waveform bars in frame 2 (center y=100, max half-height 17) -->
  <rect x="100" y="95" width="3" height="10" fill="#3A4460"/>
  <rect x="105" y="90" width="3" height="20" fill="#4E5E82"/>
  <rect x="110" y="85" width="3" height="30" fill="#6073A0"/>
  <rect x="115" y="92" width="3" height="16" fill="#4E5E82"/>
  <rect x="120" y="83" width="3" height="34" fill="#7A8DB8"/>
  <rect x="125" y="88" width="3" height="24" fill="#6073A0"/>
  <rect x="130" y="94" width="3" height="12" fill="#3A4460"/>
  <rect x="135" y="86" width="3" height="28" fill="#6073A0"/>
  <rect x="140" y="93" width="3" height="14" fill="#3A4460"/>
  <rect x="145" y="90" width="3" height="20" fill="#4E5E82"/>

  <!-- Cut line: amber glow then sharp line -->
  <line x1="152" y1="72" x2="152" y2="128" stroke="#C08A20" stroke-width="8" stroke-opacity="0.18"/>
  <line x1="152" y1="72" x2="152" y2="128" stroke="#C08A20" stroke-width="2"/>

  <!-- Cut point markers (edit triangles) -->
  <polygon points="147,72 157,72 152,80"  fill="#C08A20"/>
  <polygon points="147,128 157,128 152,120" fill="#C08A20"/>

  <!-- ── TYPOGRAPHY ── -->
  <!-- WGI -->
  <text x="240" y="130"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="88"
        fill="#FFFFFF"
        letter-spacing="3">WGI</text>

  <!-- VIDEO-SYNC label -->
  <text x="245" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="700"
        fill="#C08A20"
        letter-spacing="7">VIDEO-SYNC</text>

  <!-- Tagline -->
  <text x="246" y="170"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#2E3550"
        letter-spacing="2.5">COMPETITION RECORDING PIPELINE</text>
</svg>
